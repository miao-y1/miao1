/* ===== SlowChat 稳定启动加载层：不依赖 Vue，防止卡死 ===== */
.slowchat-boot-loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FCFAF6;
    transition: opacity 0.22s ease-out, visibility 0.22s ease-out;
}

.slowchat-boot-loader.slowchat-boot-hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.slowchat-boot-card {
    min-width: 180px;
    padding: 24px 28px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.86);
    border: 1px solid rgba(197, 168, 128, 0.28);
    box-shadow: 0 16px 42px -22px rgba(42, 44, 46, 0.32);
    text-align: center;
}

.slowchat-boot-logo {
    font-family: 'Cinzel', 'Noto Serif SC', serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: #2A2C2E;
    line-height: 1;
}

.slowchat-boot-sub {
    margin-top: 8px;
    font-family: 'Noto Serif SC', serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.28em;
    color: #C5A880;
}

.slowchat-boot-dots {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    gap: 6px;
}

.slowchat-boot-dots span {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: #C5A880;
    opacity: 0.35;
    animation: slowchatBootDot 1s infinite ease-in-out;
}

.slowchat-boot-dots span:nth-child(2) {
    animation-delay: 0.15s;
}

.slowchat-boot-dots span:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes slowchatBootDot {
    0%, 80%, 100% {
        opacity: 0.28;
        transform: translateY(0);
    }
    40% {
        opacity: 1;
        transform: translateY(-4px);
    }
}

.app-loading-mask {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(252, 250, 246, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
}

.app-loading-card {
    padding: 18px 22px;
    border-radius: 22px;
    background: rgba(255,255,255,0.9);

    font-size: 12px;
    font-weight: 800;

}

.app-loading-spinner {
    width: 18px;

    border: 2px solid rgba(197,168,128,.35);
    border-top-color: #C5A880;
    border-radius: 999px;
    animation: spinFix 0.8s linear infinite;
}

@keyframes spinFix {
    to { transform: rotate(360deg); }
}

<body class="sans-body relative w-screen h-screen select-none overflow-hidden">

<div id="slowchatBootLoader" class="slowchat-boot-loader">
    <div class="slowchat-boot-card">
        <div class="slowchat-boot-logo">SlowChat</div>
        <div class="slowchat-boot-sub">慢聊</div>
        <div class="slowchat-boot-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</div>

<script>
(function () {
    function removeBootLoader() {
        var loader = document.getElementById('slowchatBootLoader');
        if (!loader) return;

        loader.classList.add('slowchat-boot-hide');

        setTimeout(function () {
            var again = document.getElementById('slowchatBootLoader');
            if (again && again.parentNode) {
                again.parentNode.removeChild(again);
            }
        }, 300);
    }

    window.removeBootLoader = removeBootLoader;

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(removeBootLoader, 900);
        });
    } else {
        setTimeout(removeBootLoader, 900);
    }

    setTimeout(removeBootLoader, 3000);
})();
</script>

                    return msg.content || '';

                const highlightPython = (code) => {
                    let escaped = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    escaped = escaped.replace(/\b(def|class|return|if|else|elif|for|while|import|from|as|in|is|not|and|or|try|except|raise|with|pass|lambda|global|nonlocal|True|False|None)\b/g, `<span class="py-keyword">$1</span>`);
                    escaped = escaped.replace(/(["'])(.*?)\1/g, `<span class="py-string">"$2"</span>`);
                    escaped = escaped.replace(/\b(\d+)\b/g, `<span class="py-number">$1</span>`);
                    escaped = escaped.replace(/(#.*?)(?=\n|$)/g, `<span class="py-comment">$1</span>`);
                    return `<div class="py-code-block"><code>${escaped}</code></div>`;
                };

                const renderCustomMarkdown = (text, role) => {
                    if (!text) return '';
                    let processed = text;

                    processed = processed.replace(/\x60\x60\x60python\s*([\s\S]*?)\x60\x60\x60/gi, (match, code) => highlightPython(code));
                    let parsedText = parseCot(processed).main;

                    if (role === 'assistant' && currentCharacter.value && currentCharacter.value.statusVars) {
                        const matches = [...parsedText.matchAll(/\[([a-zA-Z_]+)([+-]\d+)\]/g)];
                        for (const match of matches) {
                            const key = match[1].toLowerCase();
                            const change = parseInt(match[2]);
                            for (const sKey in currentCharacter.value.statusVars) {
                                if (sKey.toLowerCase() === key) {
                                    currentCharacter.value.statusVars[sKey] = Math.max(0, Math.min(100, Number(currentCharacter.value.statusVars[sKey]) + change));
                                }
                            }
                            parsedText = parsedText.replace(match[0], '');
                        }
                    }

                    const maxLayers = settings.maxRenderLayers || 3;
                    if (currentCharacter.value && currentCharacter.value.regexScripts) {
                        for (let layer = 0; layer < maxLayers; layer++) {
                            let changed = false;
                            currentCharacter.value.regexScripts.forEach(script => {
                                if (script.findRegex && script.replaceString && !script.disabled) {
                                    try {
                                        const match = script.findRegex.match(/^\/(.*?)\/([gimyus]*)$/);
                                        const re = match ? new RegExp(match[1], match[2]) : new RegExp(script.findRegex, 'g');
                                        const oldText = parsedText;
                                        parsedText = parsedText.replace(re, script.replaceString);
                                        if (parsedText !== oldText) changed = true;
                                    } catch (err) {}

                            });
                            if (!changed) break;

${currentCharacter.value.personality || ''}

场景：
${currentCharacter.value.scenario || ''}

当前与角色对话的主角：
姓名：${activePersona.value.name}
${activePersona.value.description || ''}

${statusStr}`;

                    let messages = [{ role: 'system', content: sysPrompt }];
                    const contextHistory = isRegenerate ? chatHistory.value.slice(0, msgIndex) : chatHistory.value;
                    messages = messages.concat(contextHistory.map(m => ({
                        role: m.role,

                    if (isRegenerate) {

                        });

                    }

                    let newSwipeContent = '';

                    try {
                        const res = await fetch(`${settings.apiUrl.replace(/\/$/, '')}/chat/completions`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${settings.apiKey}`
                            },

                                model: settings.model,
                                messages,
                                temperature: settings.temperature,

                            }),
                            signal: abortController.value.signal

                   const extractImageFromResponse = (raw) => {
    if (!raw) return '';

    let content = String(raw).trim();

    try {
        const parsed = JSON.parse(content);
        const candidates = [
            parsed.url,
            parsed.image,
            parsed.image_url,
            parsed.output,
            parsed.result,
            parsed.data?.[0]?.url,
            parsed.data?.[0]?.b64_json,
            parsed.images?.[0]
        ].filter(Boolean);

        if (candidates.length) {
            content = String(candidates[0]).trim();
        }
    } catch (e) {}

    const mdMatch = content.match(/!\[[^\]]*?\]\((.*?)\)/);
    if (mdMatch && mdMatch[1]) return mdMatch[1].trim();

    const htmlImg = content.match(/<img[^>]+src=["']([^"']+)["']/i);
    if (htmlImg && htmlImg[1]) return htmlImg[1].trim();

    const dataMatch = content.match(/data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/=\s]+/);
    if (dataMatch) return dataMatch[0].replace(/\s/g, '');

    const urlMatch = content.match(/https?:\/\/[^\s"'<>）)]+/);
    if (urlMatch) {
        return urlMatch[0].replace(/[，。；;、]+$/g, '').trim();
    }

    const base64Match = content.match(/([A-Za-z0-9+/]{120,}=*)/);
    if (base64Match) return `data:image/png;base64,${base64Match[1]}`;

    return '';
};

const normalizeImageUrl = (url) => {
    if (!url) return '';

    let finalUrl = String(url)
        .trim()
        .replace(/&amp;/g, '&')
        .replace(/^["']|["']$/g, '');

    if (finalUrl.startsWith('data:image')) return finalUrl;

    if (finalUrl.startsWith('http')) {
        const joiner = finalUrl.includes('?') ? '&' : '?';
        finalUrl = `${finalUrl}${joiner}_miao_preview=${Date.now()}`;
    }

    return finalUrl;
};

        const content =
            resultData.choices?.[0]?.message?.content ||
            resultData.data?.[0]?.url ||
            resultData.data?.[0]?.b64_json ||
            resultData.url ||
            resultData.image ||
            resultData.output ||
            resultData.result ||
            '';

        const extracted = extractImageFromResponse(content);
        const finalImg = normalizeImageUrl(extracted);

        if (!finalImg || !(finalImg.startsWith('http') || finalImg.startsWith('data:image'))) {
            throw new Error("返回内容中未提取到可预览的图片地址或 Base64。");
        }

        imagePreviewLoading.value = true;
        generatedImage.value = finalImg;
        showToast("图片地址已获取，正在载入预览。", "success");

    } catch (e) {
        imagePreviewError.value = e.message;
        showToast(`生图失败：${e.message}`, "error");
    } finally {
        isGeneratingImage.value = false;
    }
};
                const downloadDreamImage = async () => {
    if (!generatedImage.value) return;

    try {
        const src = generatedImage.value;

        // base64 图片直接下载
        if (src.startsWith('data:image')) {
            const link = document.createElement("a");
            link.href = src;
            link.download = `miao_dream_image_${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('图片已下载。');
            return;
        }

        // 外链图片尝试转 Blob，避免跳转外站
        const res = await fetch(src, {
            method: 'GET',
            mode: 'cors',
            credentials: 'omit',
            cache: 'no-store'
        });

        if (!res.ok) throw new Error(`图片拉取失败 HTTP ${res.status}`);

        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = blobUrl;
        link.download = `miao_dream_image_${Date.now()}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        setTimeout(() => URL.revokeObjectURL(blobUrl), 1500);

        showToast('图片已下载。');

    } catch (e) {
        showToast('当前图片源不允许浏览器直接下载，建议启用后端下载代理。', 'error');
        console.error(e);
    }
};

const safeJsonParse = (raw, fallback) => {
    if (!raw) return fallback;
    try {
        return JSON.parse(raw);
    } catch (e) {
        console.warn('本地数据解析失败：', e);
        return fallback;
    }
};

const mergeReactive = (target, source) => {
    if (!source || typeof source !== 'object') return;
    Object.keys(source).forEach(key => {
        if (key in target) target[key] = source[key];
    });
};

const loadData = () => {
    appReady.value = true;

    try {
        const savedChars = safeJsonParse(localStorage.getItem('miao_chars'), []);
        if (Array.isArray(savedChars)) {
            characters.value = savedChars.map(c => ({
                uuid: c.uuid || generateUUID(),
                name: c.name || '未命名角色',
                description: c.description || '',
                first_mes: c.first_mes || '',
                avatar: c.avatar || defaultAvatar,
                personality: c.personality || '',
                scenario: c.scenario || '',
                mes_example: c.mes_example || '',
                system_prompt: c.system_prompt || '',
                post_history_instructions: c.post_history_instructions || '',
                statusVars: c.statusVars || { affection: 50, trust: 30, dependency: 20 },
                worldInfo: Array.isArray(c.worldInfo) ? c.worldInfo.map(normWI) : [],
                regexScripts: Array.isArray(c.regexScripts) ? c.regexScripts.map(normRX) : [],
                uiTemplates: Array.isArray(c.uiTemplates) ? c.uiTemplates.map(normUI) : []
            }));
        }

        const savedProfiles = safeJsonParse(localStorage.getItem('miao_user_profiles'), null);
        if (Array.isArray(savedProfiles) && savedProfiles.length) {
            userProfiles.value = savedProfiles.map(p => ({
                uuid: p.uuid || generateUUID(),
                name: p.name || '主角',
                description: p.description || '',
                avatar: p.avatar || ''
            }));
        }

        const savedPersonaIdx = Number(localStorage.getItem('miao_active_persona_idx'));
        activePersonaIndex.value =
            !Number.isNaN(savedPersonaIdx) &&
            savedPersonaIdx >= 0 &&
            savedPersonaIdx < userProfiles.value.length
                ? savedPersonaIdx
                : 0;

        const savedSettings = safeJsonParse(localStorage.getItem('miao_settings'), null);
        if (savedSettings) mergeReactive(settings, savedSettings);

        if (!settings.apiUrl) settings.apiUrl = 'https://api.openai.com/v1';
        if (!settings.model) settings.model = 'gpt-4o-mini';
        if (!settings.dialogueFontSize) settings.dialogueFontSize = '15px';
        if (!settings.maxRenderLayers) settings.maxRenderLayers = 3;

        const savedImageSettings = safeJsonParse(localStorage.getItem('miao_image_settings'), null);
        if (savedImageSettings) mergeReactive(imageSettings, savedImageSettings);

        if (!imageSettings.apiUrl) imageSettings.apiUrl = 'https://api.openai.com/v1';
        if (!imageSettings.model) imageSettings.model = 'nai-diffusion-4-5-full:k_dpmpp_2m_sde';
        if (!imageSettings.prompt) imageSettings.prompt = '1girl, masterpiece, best quality';
        if (!imageSettings.size) imageSettings.size = '竖图';
        if (!imageSettings.sampler) imageSettings.sampler = 'k_dpmpp_2m_sde';

        const savedModels = safeJsonParse(localStorage.getItem('miao_models_list'), []);
        if (Array.isArray(savedModels)) modelsList.value = savedModels;

        customChatBg.value = localStorage.getItem('miao_custom_chat_bg') || '';
        sidebarCollapsed.value = localStorage.getItem('miao_sidebar_collapsed') === '1';

        const lastCharUuid = localStorage.getItem('miao_current_character_uuid');
        if (lastCharUuid) {
            const restoredIndex = characters.value.findIndex(c => c.uuid === lastCharUuid);
            if (restoredIndex >= 0) {
                currentCharacterIndex.value = restoredIndex;
                const char = characters.value[restoredIndex];
                const savedChat = safeJsonParse(localStorage.getItem(`miao_chat_${char.uuid}`), []);
                chatHistory.value = Array.isArray(savedChat) ? savedChat : [];
                editCharacter(restoredIndex);
            }
        }

        const savedDraft = safeJsonParse(localStorage.getItem('miao_editor_draft'), null);
        if (savedDraft && !savedDraft.skipped && savedDraft.data) {
            editingCharacter.id = savedDraft.id;
            editingCharacter.data = {
                ...editingCharacter.data,
                ...savedDraft.data,
                statusVars: savedDraft.data.statusVars || {},
                worldInfo: Array.isArray(savedDraft.data.worldInfo) ? savedDraft.data.worldInfo.map(normWI) : [],
                regexScripts: Array.isArray(savedDraft.data.regexScripts) ? savedDraft.data.regexScripts.map(normRX) : [],
                uiTemplates: Array.isArray(savedDraft.data.uiTemplates) ? savedDraft.data.uiTemplates.map(normUI) : []
            };
            if (savedDraft.editorTab) editorTab.value = savedDraft.editorTab;
        } else if (characters.value[0] && editingCharacter.id === undefined) {
            editingCharacter.id = 0;
            editingCharacter.data = JSON.parse(JSON.stringify(characters.value[0]));
        }

    } catch (e) {
        console.error('载入本地数据失败：', e);
        showToast('本地数据载入失败，已使用默认配置。', 'error');

 } finally {
        appReady.value = true;

        setTimeout(() => {
            appReady.value = true;
        }, 300);
    }
};
